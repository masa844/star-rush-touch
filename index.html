<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#02040d">
<title>Star Rush: Touch Overdrive</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040d;color:#eef7ff;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;overscroll-behavior:none;touch-action:none}body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,640px);height:100dvh;overflow:hidden;background:#040819;box-shadow:0 0 70px #075f9e55;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;pointer-events:none;text-shadow:0 2px 8px #000}.stats{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:.08em;font-size:12px;margin-bottom:7px}#hpHud{position:absolute;z-index:4;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));pointer-events:none;text-shadow:0 2px 8px #000}.hp-label{display:flex;justify-content:space-between;color:#82ffe1;font-size:10px;font-weight:900;letter-spacing:.13em;margin-bottom:4px}.hp-track{height:24px;padding:3px;border:1px solid #69ffe099;border-radius:999px;background:#071928e8;box-shadow:0 0 20px #38ffce30}.hp-fill{width:100%;height:100%;border-radius:999px;background:linear-gradient(90deg,#20f39b,#69ffe0,#d9fff6);box-shadow:0 0 14px #4cffd0;transition:width .08s linear}
#bossHud{margin:10px auto 0;width:82%;opacity:0;transition:opacity .2s;text-align:center}.boss-name{font-size:9px;font-weight:900;letter-spacing:.22em;color:#ff9ed8;margin-bottom:3px}.boss-track{height:9px;padding:2px;border:1px solid #ff70c680;border-radius:999px;background:#240d28}.boss-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ff386d,#ff55d6,#ffbd68)}
#modeBtn{position:absolute;z-index:5;right:max(16px,env(safe-area-inset-right));bottom:max(66px,calc(env(safe-area-inset-bottom) + 58px));width:118px;height:118px;border-radius:50%;border:3px solid #74e8ffcc;background:radial-gradient(circle at 35% 28%,#224d78,#0a1730 67%,#060c19);color:#eafbff;box-shadow:0 0 0 5px #051126aa,0 0 28px #25bdff88,inset 0 0 25px #1ea7e755;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 15px/1.1 ui-monospace,monospace;letter-spacing:.04em;touch-action:manipulation}.mode-small{font-size:8px;color:#8fddff;letter-spacing:.15em;margin-bottom:6px}.mode-next{font-size:8px;color:#92a9bf;margin-top:6px;font-weight:700}.mode-accent{color:#7ffff0}#modeBtn:active{transform:scale(.95);filter:brightness(1.35)}
#toast{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-weight:900;font-size:clamp(22px,7vw,36px);letter-spacing:.12em;color:#fff;text-shadow:0 0 12px #00c8ff,0 0 28px #3377ff;pointer-events:none;opacity:0}
@media(max-width:600px){#modeBtn{right:max(12px,env(safe-area-inset-right));bottom:max(52px,calc(env(safe-area-inset-bottom) + 44px));width:96px;height:52px;border-radius:16px;border-width:2px;font-size:11px;line-height:1;box-shadow:0 0 0 3px #051126aa,0 0 20px #25bdff77,inset 0 0 18px #1ea7e744}.mode-small,.mode-next{display:none}.mode-accent{white-space:nowrap;font-size:11px;letter-spacing:.02em}}@media(max-width:390px){.stats{font-size:11px}.hp-track{height:21px}}
</style>
</head>
<body><div id="wrap">
<canvas id="game" width="720" height="1280" tabindex="0" aria-label="タップまたはクリックで移動する縦スクロールシューティング"></canvas>
<div id="top"><div class="stats"><span>SCORE <b id="score">0000000</b></span><span>STAGE <b id="stage">1</b></span></div><div id="bossHud"><div class="boss-name">DREADNOVA CORE</div><div class="boss-track"><div class="boss-fill" id="bossFill"></div></div></div></div>
<div id="hpHud"><div class="hp-label"><span>HULL INTEGRITY</span><span id="hpText">3000 / 3000</span></div><div class="hp-track"><div class="hp-fill" id="hpFill"></div></div></div>
<div id="toast">STAGE 1</div>
<button id="modeBtn" aria-label="攻撃モードを切り替える"><span class="mode-small">AUTO WEAPON</span><span id="modeName" class="mode-accent">SHOT</span><span class="mode-next">TAP / SPACE</span></button>
</div><script>
(()=>{
const c=document.querySelector('#game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const scoreEl=document.querySelector('#score'),stageEl=document.querySelector('#stage'),hpFill=document.querySelector('#hpFill'),hpText=document.querySelector('#hpText'),bossHud=document.querySelector('#bossHud'),bossFill=document.querySelector('#bossFill'),toast=document.querySelector('#toast'),modeBtn=document.querySelector('#modeBtn'),modeName=document.querySelector('#modeName');
const MODES=['SHOT','HEAVY','WIDE','BIG BANG','LASER','SPIRAL','HOMING','FIREWORK','BUSTER','AEGIS'];let modeIndex=0;
const stars=[],shots=[],enemies=[],eBullets=[],particles=[],rings=[],busterBursts=[];let score=0,stage=1,time=0,spawnClock=0,stageTime=0,bossDelay=0,boss=null,shake=0,toastT=2.3,pointerDown=false,homingCursor=0,sweepAngle=-Math.PI/2,sweepBossCooldown=0;
const player={x:W/2,y:H*.77,targetX:W/2,targetY:H*.77,r:18,speed:760,hp:3000,maxHp:3000,inv:0,fire:0};
const AEGIS_RADIUS=78;let aegisBossStart=null;
for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:.3+Math.random()*2,s:1+Math.random()*2});
function pointerTarget(e){const r=c.getBoundingClientRect();player.targetX=(e.clientX-r.left)*W/r.width;player.targetY=(e.clientY-r.top)*H/r.height;}
c.addEventListener('pointerdown',e=>{pointerDown=true;c.focus({preventScroll:true});c.setPointerCapture?.(e.pointerId);pointerTarget(e);e.preventDefault()});c.addEventListener('pointermove',e=>{if(pointerDown)pointerTarget(e)});c.addEventListener('pointerup',()=>pointerDown=false);c.addEventListener('pointercancel',()=>pointerDown=false);
function selectMode(index){modeIndex=index;if(MODES[modeIndex]==='BUSTER')sweepAngle=-Math.PI/2;modeName.textContent=MODES[modeIndex];modeBtn.animate([{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:150});burst(player.x,player.y,MODES[modeIndex]==='BUSTER'?'#ff294d':MODES[modeIndex]==='AEGIS'?'#bffcff':'#6ffff0',18)}
function cycleMode(){selectMode((modeIndex+1)%MODES.length)}
modeBtn.addEventListener('pointerdown',e=>e.stopPropagation());modeBtn.addEventListener('click',e=>{e.stopPropagation();cycleMode()});addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();cycleMode();return}if(/^[1-9]$/.test(e.key)){e.preventDefault();selectMode(Number(e.key)-1);return}if(e.key==='0'){e.preventDefault();selectMode(9)}});
function burst(px,py,col,n=10){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*280;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.55,max:.85,c:col,r:2+Math.random()*4})}}
function hit(a,b,pad=0){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r+pad}
function lineHitCircle(x1,y1,x2,y2,circle,pad=0){let vx=x2-x1,vy=y2-y1,wx=circle.x-x1,wy=circle.y-y1,len=vx*vx+vy*vy||1,t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/len)),px=x1+vx*t,py=y1+vy*t;return Math.hypot(circle.x-px,circle.y-py)<circle.r+pad}
function sweepEnd(){return{x:player.x+Math.cos(sweepAngle)*1500,y:player.y+Math.sin(sweepAngle)*1500}}
function crossedByBuster(circle,start,delta){const steps=Math.max(1,Math.ceil(Math.abs(delta)/(Math.PI/360)));for(let i=0;i<=steps;i++){let a=start+delta*i/steps,x=player.x+Math.cos(a)*1500,y=player.y+Math.sin(a)*1500;if(lineHitCircle(player.x,player.y,x,y,circle,17))return true}return false}
function spawnEnemy(){const p=Math.random(),type=p<.42?'scout':p<.75?'swoop':'tank',side=Math.random()<.5?-1:1,e={type,x:70+Math.random()*(W-140),y:-50,t:0,fire:.7+Math.random()*1.1,side};if(type==='scout')Object.assign(e,{hp:3,r:18,v:150+stage*7,score:120});if(type==='swoop')Object.assign(e,{hp:6,r:22,v:130+stage*6,score:240});if(type==='tank')Object.assign(e,{hp:13,r:31,v:82+stage*5,score:450});enemies.push(e)}
function homingTargetAlive(t){return !!t&&(t===boss||enemies.includes(t)||eBullets.includes(t))}
function acquireHoming(){const locked=new Set();for(const s of shots)if(s.homing&&homingTargetAlive(s.target))locked.add(s.target);const targets=enemies.filter(e=>e.y>90&&!locked.has(e)).sort((a,b)=>b.y-a.y);if(targets.length)return targets[0];const bullets=eBullets.filter(b=>b.y>20&&!locked.has(b)).sort((a,b)=>b.y-a.y);if(bullets.length)return bullets[0];if(boss)return boss;return null}
function homingThreatCount(){return enemies.reduce((n,e)=>n+(e.y>90?1:0),0)+Math.min(12,eBullets.length)+(boss?8:0)}
function homingSalvoSize(n){return n>60?6:n>40?5:n>26?4:n>14?3:n>6?2:1}
function launchHoming(){const target=acquireHoming();if(!target)return false;const s={kind:'homing',x:player.x,y:player.y-30,vx:0,vy:-1100,r:9,damage:14,life:2.8,clear:true,homing:true,target};let dx=target.x-s.x,dy=target.y-s.y,d=Math.hypot(dx,dy)||1;s.vx=dx/d*1100;s.vy=dy/d*1100;shots.push(s);return true}
function autoFire(dt){player.fire-=dt;if(player.fire>0)return;const m=MODES[modeIndex];if(m==='SHOT'){shots.push({kind:'normal',x:player.x-8,y:player.y-30,vx:0,vy:-900,r:5,damage:3,life:2},{kind:'normal',x:player.x+8,y:player.y-30,vx:0,vy:-900,r:5,damage:3,life:2});player.fire=.075}else if(m==='HEAVY'){shots.push({kind:'heavy',x:player.x,y:player.y-45,vx:0,vy:-610,r:26,damage:22,life:2.3,clear:true});player.fire=.22}else if(m==='WIDE'){for(let a=-60;a<=60;a+=20){let q=a*Math.PI/180;shots.push({kind:'wide',x:player.x,y:player.y-25,vx:Math.sin(q)*700,vy:-Math.cos(q)*700,r:9,damage:6,life:1.9,clear:true})}player.fire=.135}else if(m==='BIG BANG'){shots.push({kind:'bomb',x:player.x,y:player.y-40,vx:0,vy:-430,r:29,damage:260,life:2.3,clear:true});player.fire=1.35}else if(m==='LASER'){shots.push({kind:'laser',x:player.x,y:player.y-52,vx:0,vy:-1250,r:13,damage:11,life:.85,clear:true});player.fire=.045}else if(m==='SPIRAL'){let sweep=Math.sin(time*3.8)*.68,count=8+Math.floor(Math.random()*7),colors=['#ff70df','#70e8ff','#ffe06c','#ad7cff'];for(let i=0;i<count;i++){let a=sweep+(Math.random()-.5)*1.5,spd=620+Math.random()*270;shots.push({kind:'spiral',x:player.x+(Math.random()-.5)*36,y:player.y-28-Math.random()*12,vx:Math.sin(a)*spd,vy:-Math.cos(a)*spd,r:6+Math.random()*4,damage:6,life:1.75+Math.random()*.35,clear:true,curve:(Math.random()-.5)*2.5,color:colors[Math.floor(Math.random()*colors.length)]})}player.fire=.085}else if(m==='HOMING'){let threats=homingThreatCount(),salvo=homingSalvoSize(threats);for(let i=0;i<salvo;i++)launchHoming();player.fire=threats>40?.018:threats>24?.025:.035}else if(m==='FIREWORK'){for(let i=0;i<16;i++){let a=Math.PI*2*i/16;shots.push({kind:'seed',x:player.x,y:player.y,vx:Math.cos(a)*350,vy:Math.sin(a)*350,r:10,damage:7,life:2.1,clear:true,split:.62})}rings.push({x:player.x,y:player.y,r:12,life:.62,color:'#ff9ff1'});player.fire=1.3}else{player.fire=.05}}
function enemyFire(e){let dx=player.x-e.x,dy=player.y-e.y,a=Math.atan2(dy,dx),count=e.type==='tank'?5:1;for(let i=0;i<count;i++){let q=a+(i-(count-1)/2)*.14,spd=e.type==='tank'?235:285;eBullets.push({x:e.x,y:e.y,vx:Math.cos(q)*spd,vy:Math.sin(q)*spd,r:e.type==='tank'?7:5,damage:e.type==='tank'?9:6})}}
function explodeBomb(s){for(const e of enemies){score+=e.score;burst(e.x,e.y,'#ffd35b',15)}enemies.length=0;eBullets.length=0;if(boss)boss.hp-=300;rings.push({x:s.x,y:s.y,r:20,life:.9,color:'#fff18a'});burst(s.x,s.y,'#fff18a',65);shake=20}
function destroyEnemy(e){score+=e.score;burst(e.x,e.y,e.type==='tank'?'#ff9855':'#ff54bf',17);rings.push({x:e.x,y:e.y,r:8,life:.35,color:'#fff'});shake=Math.max(shake,4)}
function addBusterBlast(x,y,size){busterBursts.push({x,y,size,life:.34,max:.34})}
function destroyBusterEnemy(e){score+=e.score;addBusterBlast(e.x,e.y,e.r*1.25);shake=Math.max(shake,9)}
function updateBuster(dt){sweepBossCooldown=Math.max(0,sweepBossCooldown-dt);if(MODES[modeIndex]!=='BUSTER')return;const start=sweepAngle,delta=-Math.PI*2*dt;sweepAngle+=delta;for(let i=eBullets.length-1;i>=0;i--)if(crossedByBuster(eBullets[i],start,delta)){addBusterBlast(eBullets[i].x,eBullets[i].y,9);eBullets.splice(i,1)}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(crossedByBuster(e,start,delta)){destroyBusterEnemy(e);enemies.splice(i,1)}}if(boss&&sweepBossCooldown<=0&&crossedByBuster(boss,start,delta)){boss.hp-=220;sweepBossCooldown=.2;addBusterBlast(boss.x,boss.y,44);shake=Math.max(shake,12);if(boss.hp<=0)defeatBoss()}}
function aegisBossSequenceActive(){return MODES[modeIndex]==='AEGIS'&&boss&&toastT<=0}
function aegisBossElapsed(){
  if(!aegisBossSequenceActive()){aegisBossStart=null;return 0}
  if(aegisBossStart===null)aegisBossStart=time;
  return time-aegisBossStart
}
function aegisCannonActive(){return aegisBossSequenceActive()&&aegisBossElapsed()>=1.5}
function aegisVaporize(x,y,r=5){for(let i=0;i<4;i++){let a=Math.random()*Math.PI*2,s=45+Math.random()*95;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.16+Math.random()*.16,max:.32,c:i%2?'#b9ffff':'#ffffff',r:1.5+Math.random()*Math.min(4,r*.12)})}}
function updateAegis(dt){
  if(MODES[modeIndex]!=='AEGIS'){aegisBossStart=null;return}
  const elapsed=aegisBossElapsed();

  // During targeting/charge/travel the normal AEGIS barrier remains active.
  if(!aegisCannonActive()){
    for(let i=eBullets.length-1;i>=0;i--){
      const b=eBullets[i];
      if(Math.hypot(b.x-player.x,b.y-player.y)<=AEGIS_RADIUS+b.r){aegisVaporize(b.x,b.y,b.r);eBullets.splice(i,1)}
    }
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(Math.hypot(e.x-player.x,e.y-player.y)<=AEGIS_RADIUS+e.r){score+=e.score;aegisVaporize(e.x,e.y,e.r);enemies.splice(i,1)}
    }
    return;
  }

  // Once the energy reaches the boss, all boss fire is suppressed and damage begins.
  eBullets.length=0;
  if(boss){
    boss.hp-=boss.maxHp*.85*dt;
    shake=Math.max(shake,3.5);
    if(Math.random()<dt*18)aegisVaporize(boss.x+(Math.random()-.5)*boss.r*1.3,boss.y+(Math.random()-.5)*boss.r*.7,9);
    if(boss.hp<=0)defeatBoss();
  }
}
function summonBoss(){enemies.length=0;eBullets.length=0;const hp=3000+stage*520;boss={x:W/2,y:-130,targetY:220,r:78,hp,maxHp:hp,t:0,fire:.8,fan:1.8};bossHud.style.opacity='1';toast.textContent='WARNING · BOSS';toastT=2.3;shake=10}
function bossFire(){let a=Math.atan2(player.y-boss.y,player.x-boss.x);for(let i=-3;i<=3;i++){let q=a+i*.13,s=250+stage*7;eBullets.push({x:boss.x,y:boss.y+45,vx:Math.cos(q)*s,vy:Math.sin(q)*s,r:7,damage:8})}}
function bossFan(){for(let i=0;i<18;i++){let a=Math.PI*.1+Math.PI*.8*(i/17),s=205+stage*5;eBullets.push({x:boss.x,y:boss.y+35,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:6,damage:6})}}
function defeatBoss(){aegisBossStart=null;score+=5000*stage;burst(boss.x,boss.y,'#ff61c9',90);rings.push({x:boss.x,y:boss.y,r:35,life:1.25,color:'#fff'});boss=null;bossHud.style.opacity='0';eBullets.length=0;stage++;stageEl.textContent=stage;stageTime=0;bossDelay=2.2;spawnClock=2.2;toast.textContent='STAGE '+stage;toastT=2.2;player.hp=Math.min(player.maxHp,player.hp+300);shake=23}
function damage(amount){if(MODES[modeIndex]==='AEGIS'||player.inv>0)return;player.hp=Math.max(0,player.hp-amount);player.inv=.12;burst(player.x,player.y,'#ff5577',10);shake=7;if(player.hp<=0){player.hp=player.maxHp;score=0;stage=1;stageEl.textContent=stage;enemies.length=0;eBullets.length=0;boss=null;aegisBossStart=null;bossHud.style.opacity='0';stageTime=0;bossDelay=2;toast.textContent='OVERDRIVE AGAIN';toastT=2.2}}
function update(dt){time+=dt;toastT-=dt;bossDelay=Math.max(0,bossDelay-dt);player.inv=Math.max(0,player.inv-dt);let dx=player.targetX-player.x,dy=player.targetY-player.y,d=Math.hypot(dx,dy);if(d>3){let step=Math.min(d,player.speed*dt);player.x+=dx/d*step;player.y+=dy/d*step}player.x=Math.max(26,Math.min(W-26,player.x));player.y=Math.max(150,Math.min(H-60,player.y));autoFire(dt);updateBuster(dt);
for(const s of stars){s.y+=100*s.z*dt;if(s.y>H){s.y=-5;s.x=Math.random()*W}}
if(!boss&&bossDelay<=0){stageTime+=dt;spawnClock-=dt;if(stageTime>=28+Math.min(8,stage)){summonBoss()}else if(spawnClock<=0){spawnClock=Math.max(.12,.55-stage*.035)*(.55+Math.random()*.45);const waveSize=Math.min(16,1+Math.floor((stage-1)*1.25));for(let k=0;k<waveSize&&enemies.length<140;k++)spawnEnemy()}}

function glow(px,py,r,color,blur=14){ctx.save();ctx.shadowBlur=blur;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawAegis(){

      const travel=Math.max(0,Math.min(1,(elapsed-1.0)/.5));
      const qx=(sx+tx)/2+bend,qy=(sy+ty)/2;
      const omt=1-travel;
      const ex=omt*omt*sx+2*omt*travel*qx+travel*travel*tx;

      beam(48,'#a5ffff',26,.78);
      beam(18,'#ffffff',20,1);
      ctx.globalAlpha=1;ctx.restore();

      glow(sx,sy,27,'#e8ffff',34);glow(sx,sy,13,'#ffffff',20);
      glow(ex,ey,18+16*travel,'#bcffff',32);glow(ex,ey,7+8*travel,'#ffffff',18);

      // Once connected, keep the more chaotic homing-energy strands and impact glow.

}
function draw(){ctx.save();if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071538');g.addColorStop(.55,'#030719');g.addColorStop(1,'#071020');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.3+s.z*.25;ctx.fillStyle=s.z>1.5?'#82ddff':'#e4f0ff';ctx.fillRect(s.x,s.y,s.s,s.s*3*s.z)}ctx.globalAlpha=1;
